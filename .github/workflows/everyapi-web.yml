name: EveryAPI Web Gateway

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.everyapi
      - cmd/everyapi-web/**
      - internal/**
      - site/**
      - native/**
      - go.mod
      - go.sum
      - scripts/everyapi-web-docker-smoke.py
      - .github/workflows/everyapi-web.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/everyapi-web-gateway

jobs:
  build-test-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set image tag
        id: image
        run: echo "tag=0.1.0-everyapi-only.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build image for the container acceptance test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.everyapi
          platforms: linux/amd64
          load: true
          tags: everyapi-web-gateway:smoke
          build-args: VERSION=${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=everyapi-web
          cache-to: type=gha,scope=everyapi-web,mode=max

      - name: Run container acceptance test
        run: python3 scripts/everyapi-web-docker-smoke.py everyapi-web-gateway:smoke

      - name: Build and publish the pinned image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.everyapi
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.image.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: VERSION=${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=everyapi-web
          cache-to: type=gha,scope=everyapi-web,mode=max
